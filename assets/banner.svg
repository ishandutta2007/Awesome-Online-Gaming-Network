<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="320" fill="url(#bg)" rx="16"/>

  <!-- Dynamic / Animated Background Grid Lines & Glowing Orbs -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="140" fill="#8b5cf6" filter="url(#glow)">
      <animate attributeName="cy" values="80;120;80" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="140;160;140" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="240" r="160" fill="#ec4899" filter="url(#glow)">
      <animate attributeName="cy" values="240;200;240" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="r" values="160;130;160" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Dynamic Grid Pattern -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.1">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
    <line x1="1100" y1="0" x2="1100" y2="320"/>
  </g>

  <!-- Dynamic Network Nodes / Floating Elements in Background -->
  <g stroke="url(#accent)" stroke-width="1.5" opacity="0.4">
    <line x1="120" y1="240" x2="280" y2="180">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="280" y1="180" x2="200" y2="100"/>
    <line x1="920" y1="80" x2="1060" y2="150">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="4s" repeatCount="indefinite"/>
    </line>
    <circle cx="120" cy="240" r="5" fill="#ec4899"/>
    <circle cx="280" cy="180" r="7" fill="#8b5cf6"/>
    <circle cx="200" cy="100" r="4" fill="#3b82f6"/>
    <circle cx="920" cy="80" r="6" fill="#3b82f6"/>
    <circle cx="1060" cy="150" r="8" fill="#ec4899"/>
  </g>

  <!-- Foreground Title and Subtitle (Crisp and Unobstructed) -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Subtitle Pill / Badge Background -->
    <rect x="375" y="48" width="450" height="34" rx="17" fill="#1e293b" opacity="0.8" stroke="#334155" stroke-width="1"/>
    <text x="600" y="70" font-size="14" font-weight="600" fill="#a7f3d0" letter-spacing="2">
      🎮 ONLINE GAMING NETWORK ECOSYSTEM 🌐
    </text>

    <!-- Main Title -->
    <text x="600" y="145" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="1" filter="url(#glow)">
      Awesome Online Gaming Network
    </text>

    <!-- Gradient Sub-bar under main title -->
    <rect x="350" y="165" width="500" height="4" rx="2" fill="url(#accent)"/>

    <!-- Subtitle Description -->
    <text x="600" y="215" font-size="17" font-weight="400" fill="#cbd5e1">
      Curated Commercial Platforms • Game Server Emulators • Open-Source Frameworks
    </text>

    <!-- Feature Pills in Foreground -->
    <g font-size="13" font-weight="600" fill="#f8fafc">
      <rect x="290" y="250" width="180" height="30" rx="15" fill="#334155" opacity="0.9"/>
      <text x="380" y="270">⚡ Server Emulation</text>

      <rect x="490" y="250" width="220" height="30" rx="15" fill="#334155" opacity="0.9"/>
      <text x="600" y="270">🔄 Cross-Platform Play</text>

      <rect x="730" y="250" width="180" height="30" rx="15" fill="#334155" opacity="0.9"/>
      <text x="820" y="270">🌐 Cloud Infrastructure</text>
    </g>
  </g>
</svg>
